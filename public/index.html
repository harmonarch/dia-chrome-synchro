<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bifröst · 双浏览器同步台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M5 30 C 12 12, 28 12, 35 30' stroke='%23c4552e' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='5' cy='30' r='3.4' fill='%23c4552e'/%3E%3Ccircle cx='35' cy='30' r='3.4' fill='%232e7d8a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Familjen+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
  <div class="grain"></div>
</div>

<div class="shell">

  <header class="topbar reveal" style="--i:0">
    <div class="wordmark">
      <svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M5 30 C 12 12, 28 12, 35 30" stroke="url(#bridge)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="5" cy="30" r="3.4" fill="var(--dia)"/>
        <circle cx="35" cy="30" r="3.4" fill="var(--chrome)"/>
        <defs>
          <linearGradient id="bridge" x1="5" y1="30" x2="35" y2="30" gradientUnits="userSpaceOnUse">
            <stop stop-color="var(--dia)"/><stop offset="1" stop-color="var(--chrome)"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="wordmark-text">
        <h1>Bifröst</h1>
        <p class="tagline">Dia ⇆ Chrome 同步台</p>
      </div>
    </div>
    <div class="status-pill glass" id="statusPill" role="status">
      <span class="pulse-dot" id="syncDot"></span>
      <span id="statusText">正在读取…</span>
    </div>
  </header>

  <main>

    <!-- 同步控制台 -->
    <section class="console glass-strong reveal" style="--i:1" aria-label="同步控制台">
      <div class="console-grid">

        <div class="block">
          <span class="block-label">以谁为主</span>
          <p class="block-hint" id="directionHint">选择数据基准，书签与插件将向另一方对齐。</p>
          <div class="browser-row" id="browserRow">
            <button class="browser-chip glass" data-browser="dia" type="button">
              <span class="tile tile-dia" aria-hidden="true">D</span>
              <span class="bc-meta"><strong>Dia</strong><em id="diaStat">…</em></span>
              <span class="primary-badge">主</span>
            </button>
            <div class="flow" aria-hidden="true">
              <svg class="flow-arc" viewBox="0 0 84 46" fill="none">
                <path id="arcPath" d="M4 38 C 26 6, 58 6, 80 38" stroke="url(#flowGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/>
                <defs>
                  <linearGradient id="flowGrad" x1="4" y1="38" x2="80" y2="38" gradientUnits="userSpaceOnUse">
                    <stop stop-color="var(--dia)"/><stop offset="1" stop-color="var(--chrome)"/>
                  </linearGradient>
                </defs>
              </svg>
              <span class="flow-dir" id="flowDir">→</span>
            </div>
            <button class="browser-chip glass" data-browser="chrome" type="button">
              <span class="tile tile-chrome" aria-hidden="true">C</span>
              <span class="bc-meta"><strong>Chrome</strong><em id="chromeStat">…</em></span>
              <span class="primary-badge">主</span>
            </button>
          </div>
        </div>

        <div class="block">
          <span class="block-label">同步频率</span>
          <div class="seg glass" id="scheduleSeg" role="tablist" aria-label="同步频率">
            <button type="button" data-v="manual" role="tab">手动</button>
            <button type="button" data-v="hourly" role="tab">每小时</button>
            <button type="button" data-v="daily" role="tab">每天</button>
            <button type="button" data-v="weekly" role="tab">每周</button>
            <span class="seg-thumb" aria-hidden="true"></span>
          </div>
          <div class="schedule-detail" id="scheduleDetail" hidden>
            <div class="detail-row" id="timeRow">
              <label for="timeSelect">时刻</label>
              <select id="timeSelect" class="glass-select"></select>
            </div>
            <div class="detail-row" id="dayRow" hidden>
              <span class="detail-label">星期</span>
              <div class="weekday-row" id="weekdayRow"></div>
            </div>
          </div>
          <p class="next-run" id="nextRun">下次同步：<b>—</b></p>
        </div>

      </div>

      <div class="action-row">
        <button class="sync-btn" id="syncBtn" type="button">
          <svg class="sync-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10a6 6 0 0 1 10.4-4.1M16 10a6 6 0 0 1-10.4 4.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M14.6 2.4v3.5h-3.5M5.4 17.6v-3.5h3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="syncBtnText">立即同步</span>
        </button>
        <div class="running-banner glass" id="runningBanner" hidden>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 6.5v4.2M10 13.6v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.6"/></svg>
          <span id="runningText"></span>
          <button class="ghost-btn" id="quitAndSyncBtn" type="button">退出并同步</button>
        </div>
      </div>
    </section>

    <!-- 书签 / 扩展 -->
    <div class="panels">

      <section class="panel glass reveal" style="--i:2" id="bookmarksPanel" aria-label="书签同步">
        <header class="panel-head">
          <div class="panel-title">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 3.5h10a.8.8 0 0 1 .8.8v12.4l-5.8-3.6-5.8 3.6V4.3a.8.8 0 0 1 .8-.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <h3>书签</h3>
          </div>
          <p class="panel-sub" id="bookmarkSummary">…</p>
        </header>
        <div class="stats" id="bookmarkStats"></div>
        <div class="diff-lists" id="bookmarkLists"></div>
        <footer class="panel-foot" id="bookmarkFoot">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4M10 6.4v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span id="bookmarkFootText"></span>
        </footer>
      </section>

      <section class="panel glass reveal" style="--i:3" id="extensionsPanel" aria-label="插件同步">
        <header class="panel-head">
          <div class="panel-title">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8 3.6a1.6 1.6 0 0 1 3.2 0V5h2.6a1 1 0 0 1 1 1v2.6h1.4a1.6 1.6 0 0 1 0 3.2h-1.4V17a1 1 0 0 1-1 1H11v-1.6a1.6 1.6 0 0 0-3.2 0V18H5a1 1 0 0 1-1-1v-2.8h1.4a1.6 1.6 0 0 0 0-3.2H4V8.2a1 1 0 0 1 1-1h3V3.6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <h3>插件</h3>
          </div>
          <p class="panel-sub" id="extensionSummary">…</p>
        </header>
        <div class="ext-sections" id="extSections"></div>
      </section>

    </div>

    <!-- 同步记录 -->
    <section class="history glass reveal" style="--i:4" aria-label="同步记录">
      <header class="history-head"><h3>同步记录</h3><span class="mono" id="historyCount"></span></header>
      <ol class="history-list" id="historyList"></ol>
    </section>

  </main>

  <footer class="page-foot mono">Bifröst v1.0 · 本地服务 127.0.0.1:8770 · 写入前自动备份</footer>
</div>

<div class="toast-stack" id="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
