name: Build DMG

# 推送 v* tag 时自动构建 DMG 并挂到 GitHub Release；也可在 Actions 页手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DMG 版本号取自 tag（v1.2.3 → 1.2.3）；手动触发时回落到 1.0.0
      - name: Derive version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "BIFROST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "BIFROST_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        run: bash mac/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bifrost-${{ env.BIFROST_VERSION }}
          path: dist/Bifrost-*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Bifrost-*.dmg \
            --title "Bifrost ${GITHUB_REF_NAME#v}" \
            --generate-notes
